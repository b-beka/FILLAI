version: '3.8'

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fillai_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fillai_password}
      POSTGRES_DB: ${POSTGRES_DB:-fillai_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "2006:2006"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fillai_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fillai_user}:${POSTGRES_PASSWORD:-fillai_password}@db:5432/${POSTGRES_DB:-fillai_db}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:

